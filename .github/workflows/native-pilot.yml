name: VPNkerla native build
on:
  pull_request:
    branches: [main]
    paths: ['native/**', '.github/workflows/native-pilot.yml']
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build and test
        required: true
        default: android
        type: choice
        options: [android, windows, linux, macos]
      api_url:
        description: HTTPS account API origin (leave empty for existing-key testing)
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: vpnkerla-pilot-${{ github.event.pull_request.number || github.ref }}-${{ inputs.platform || 'android' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ${{ fromJSON('{"android":"ubuntu-24.04","windows":"windows-2022","linux":"ubuntu-24.04","macos":"macos-15"}')[inputs.platform || 'android'] }}
    timeout-minutes: 90
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      KERLA_TARGET: ${{ inputs.platform || 'android' }}
      KERLA_API_ORIGIN: ${{ inputs.api_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct pinned VPNkerla source
        shell: bash
        run: python native/materialize.py "$RUNNER_TEMP/vpnkerla-client"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: false
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - uses: actions/setup-java@v4
        if: (inputs.platform || 'android') == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: (inputs.platform || 'android') == 'android'
      - name: Android SDK and NDK
        if: (inputs.platform || 'android') == 'android'
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          vpnkerla_ndk="$ANDROID_HOME/ndk/28.2.13676358"
          test -f "$vpnkerla_ndk/toolchains/llvm/prebuilt/linux-x86_64/lib/libclang.so"
          echo "ANDROID_NDK_HOME=$vpnkerla_ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_PATH=$vpnkerla_ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$vpnkerla_ndk" >> "$GITHUB_ENV"
      - name: Linux development libraries
        if: (inputs.platform || 'android') == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev libsecret-1-dev
      - name: Windows Go compiler
        if: (inputs.platform || 'android') == 'windows'
        shell: pwsh
        run: |
          'C:\mingw64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (!(Test-Path 'C:\mingw64\bin\gcc.exe')) { throw 'MinGW compiler missing on runner' }
      - name: Check and build pilot
        shell: bash
        run: python "$RUNNER_TEMP/vpnkerla-client/tool/kerla_build.py" --platform "$KERLA_TARGET" --api-url "$KERLA_API_ORIGIN"
      - uses: actions/upload-artifact@v4
        with:
          name: VPNkerla-${{ inputs.platform || 'android' }}-pilot
          path: ${{ runner.temp }}/vpnkerla-client/kerla-dist/
          if-no-files-found: error
          retention-days: 14
